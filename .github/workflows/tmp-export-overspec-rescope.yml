name: Temporary export overspec rescope sources
on:
  push:
    branches: [replay-prefix-draw-pinning-design]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay-prefix-draw-pinning-design
      - uses: actions/upload-artifact@v4
        with:
          name: overspec-rescope-sources
          path: |
            Combat/search/decision_context.py
            Combat/search/rng_hypothesis.py
            Combat/search/main_loop.py
            Combat/tests/test_replay_prefix_visible_draw_pinning.py
            Combat/tests/test_replay_prefix_draw_then_choose_generalization.py
            API/instance_combat.py
            API/masking.py
            API/tests/test_acrobatics_exact_instance_replay_pinning.py
            API/tests/test_visible_card_instance_masking.py
            .github/workflows/paired-v07-counterpart-gate.yml
            Outputs/reports/replay_prefix_draw_pinning_design_20260816.md
