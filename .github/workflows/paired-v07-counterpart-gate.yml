name: paired-v07-counterpart-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  rl-hosted-contract:
    # This required job is intentionally repo-local. The legacy workflow name is
    # retained for tooling compatibility, but this job is not evidence that a
    # particular Training/RL commit pair passed cross-repository integration.
    name: rl-hosted-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out RL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hosted-test dependencies
        run: python -m pip install pytest

      - name: Compile protocol and coordinator modules
        run: python -m compileall -q API Combat/search

      - name: Run hosted protocol and contract regression tests
        run: |
          python -m pytest -q \
            API/tests/test_dto_validation.py \
            API/tests/test_server_replay_cache.py \
            API/tests/test_server_response_finalization.py \
            API/tests/test_server_operation_capabilities.py \
            API/tests/test_tcp_dto_contract.py \
            API/tests/test_tcp_server.py \
            API/tests/test_validation_simulation_options.py \
            API/tests/test_terminal_mask_contract.py \
            API/tests/test_rng_hypothesis_rollback.py \
            API/tests/test_branch_manager_poll_scope.py \
            API/tests/test_branch_manager_stale_results.py \
            API/tests/test_emulate_actions_oversize_preflight.py \
            API/tests/test_review_followup_fixes.py \
            API/tests/test_root_commit_release_lifecycle.py \
            API/tests/test_whole_run_action_id_resolution.py

      - name: Explain paired validation boundary
        if: always()
        run: |
          echo "This required check proves only RL repo-local hosted contract/coordinator regressions."
          echo "It does not attest an exact Training/RL commit pair."
          echo "Real-Emulator paired validation remains separate and must not be treated as a trusted release gate until it runs through an isolated exact-pair orchestrator."
