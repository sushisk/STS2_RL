name: paired-v07-counterpart-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  training-counterpart:
    name: current Training head attests this RL head
    runs-on: ubuntu-latest
    steps:
      - name: Verify reciprocal exact-pair attestation
        shell: bash
        env:
          RL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PAIR_STATUS_CONTEXT: paired-v07-trusted-exact-pair
        run: |
          set -euo pipefail

          training_pr_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/sushisk/STS2_Training/pulls/19)"
          training_sha="$(printf '%s' "${training_pr_json}" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          echo "RL head SHA:       ${RL_HEAD_SHA}"
          echo "Training head SHA: ${training_sha}"

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/sushisk/STS2_Training/commits/${training_sha}/statuses?per_page=100" \
            > training-statuses.json

          python - "${PAIR_STATUS_CONTEXT}" "${RL_HEAD_SHA}" <<'PY'
          import json
          import sys

          context = sys.argv[1]
          rl_sha = sys.argv[2]
          expected_description = f"Passed with RL {rl_sha[:12]}"
          with open("training-statuses.json", "r", encoding="utf-8") as f:
              statuses = json.load(f)
          matching = [s for s in statuses if s.get("context") == context]
          if not matching:
              raise SystemExit(
                  "current Training PR head has no trusted exact-pair attestation"
              )
          latest = matching[0]
          if latest.get("state") != "success":
              raise SystemExit(
                  f"Training exact-pair status is {latest.get('state')!r}, not success"
              )
          if latest.get("description") != expected_description:
              raise SystemExit(
                  "Training attestation is stale for this RL head: "
                  f"{latest.get('description')!r} != {expected_description!r}"
              )
          print("Reciprocal exact-pair attestation is current.")
          PY

          {
            echo '### Paired v0.7 reciprocal gate'
            echo "- RL head: \`${RL_HEAD_SHA}\`"
            echo "- Training head: \`${training_sha}\`"
            echo "- Required status: \`${PAIR_STATUS_CONTEXT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
