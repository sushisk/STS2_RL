name: paired-v07-counterpart-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  training-counterpart:
    name: current Training head attests this RL head
    # Reciprocal exact-pair validation depends on the real Emulator test that
    # is intentionally executed outside GitHub Actions. Missing external
    # attestation must not appear as a red PR check, because that can hide
    # genuine code/test failures among environment-only failures.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Real-environment counterpart validation is external-only
        run: echo "Environment-dependent exact-pair validation is intentionally skipped in GitHub Actions."
