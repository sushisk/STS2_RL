name: paired-v07-counterpart-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  training-counterpart:
    # Keep the existing job/check name so branch-protection rules that already
    # require this context continue to work. The implementation is now fully
    # GitHub-hosted and does not wait for an externally-published attestation.
    name: current Training head attests this RL head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out RL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hosted-test dependencies
        run: python -m pip install pytest

      - name: Compile protocol and coordinator modules
        run: python -m compileall -q API Combat/search

      - name: Run hosted protocol and contract regression tests
        run: |
          python -m pytest -q \
            API/tests/test_dto_validation.py \
            API/tests/test_server_replay_cache.py \
            API/tests/test_server_response_finalization.py \
            API/tests/test_tcp_dto_contract.py \
            API/tests/test_tcp_server.py \
            API/tests/test_validation_simulation_options.py \
            API/tests/test_terminal_mask_contract.py \
            API/tests/test_rng_hypothesis_rollback.py \
            API/tests/test_branch_manager_poll_scope.py \
            API/tests/test_branch_manager_stale_results.py \
            API/tests/test_review_followup_fixes.py

      - name: Explain real-Emulator coverage
        if: always()
        run: |
          echo "The merge-blocking check is intentionally self-contained on GitHub-hosted runners."
          echo "Tests that instantiate the real Combat Emulator remain optional/manual because they require Sts2Emulator.dll and the local Emulator runtime."
