name: agent RL reward validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reward-decision-architecture
          fetch-depth: 0
      - name: Compile Python
        run: python -m compileall -q API Run
      - name: Reward transport unit tests
        run: python Run/tests/test_reward_auto_progress.py
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent_rl_reward_validation.yml
          git commit -m 'remove temporary reward validation workflow'
          git push origin HEAD:agent/reward-decision-architecture
