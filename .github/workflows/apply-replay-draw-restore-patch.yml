name: apply-replay-draw-restore-patch

on:
  push:
    branches:
      - replay-prefix-draw-pinning-design
    paths:
      - scripts/apply_replay_draw_restore_patch.py
      - .github/workflows/apply-replay-draw-restore-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay-prefix-draw-pinning-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source transformation
        run: python scripts/apply_replay_draw_restore_patch.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            Combat/search/replay_draw_restore.py \
            Combat/search/decision_context.py \
            Combat/search/main_loop.py \
            Combat/search/rng_hypothesis.py \
            API/instance_combat.py \
            Combat/tests/test_replay_prefix_visible_draw_pinning.py \
            API/tests/test_acrobatics_exact_instance_replay_pinning.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_replay_draw_restore_patch.py
          rm .github/workflows/apply-replay-draw-restore-patch.yml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Implement observable replay draw restoration"
          git push origin HEAD:replay-prefix-draw-pinning-design
