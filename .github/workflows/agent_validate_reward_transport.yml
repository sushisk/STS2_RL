name: agent validate reward transport

on:
  push:
    branches:
      - agent/reward-decision-architecture

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reward-decision-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile API and Run
        run: python -m compileall -q API Run
      - name: Reward transport regression tests
        run: python Run/tests/test_reward_auto_progress.py
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/agent_validate_reward_transport.yml
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent_validate_reward_transport.yml
          git commit -m 'remove temporary reward transport validation workflow'
          git push origin HEAD:agent/reward-decision-architecture
