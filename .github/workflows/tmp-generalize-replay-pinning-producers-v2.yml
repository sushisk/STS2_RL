name: Temporary replay pinning producer boundary refactor
on:
  push:
    branches: [replay-prefix-draw-pinning-design]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay-prefix-draw-pinning-design
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply producer boundary refactor
        run: python scripts/tmp_generalize_replay_pinning_producers.py
      - name: Verify old card-wired entrypoint is gone
        shell: bash
        run: |
          if git grep -n 'visible_draw_constraints_from_pending_choice' -- '*.py'; then
            exit 1
          fi
      - name: Compile changed modules
        run: python -m compileall -q API/instance_combat.py Combat/search/decision_context.py Combat/search/main_loop.py Combat/search/rng_hypothesis.py Combat/tests/test_replay_prefix_visible_draw_pinning.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run replay pinning regressions
        run: python -m pytest -q Combat/tests/test_replay_prefix_visible_draw_pinning.py
      - name: Commit source refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add API/instance_combat.py Combat/search/decision_context.py Combat/search/main_loop.py Combat/tests/test_replay_prefix_visible_draw_pinning.py Outputs/reports/replay_prefix_draw_pinning_design_20260816.md
          git diff --cached --check
          git commit -m "refactor: make replay draw pinning producer extensible"
          git push origin HEAD:replay-prefix-draw-pinning-design
