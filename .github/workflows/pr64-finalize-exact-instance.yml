name: pr64-finalize-exact-instance

on:
  push:
    branches: [replay-prefix-draw-pinning-design]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: diagnose PR64 exact-instance tests' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: replay-prefix-draw-pinning-design
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact-instance implementation
        run: python .github/pr64_finalize.py

      - name: Install hosted test dependency
        run: python -m pip install pytest

      - name: Compile changed Python modules
        run: python -m compileall -q API Combat/search Combat/tests/test_replay_prefix_visible_draw_pinning.py API/tests/test_visible_card_instance_masking.py

      - name: Run pure hosted regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            Combat/tests/test_replay_prefix_visible_draw_pinning.py \
            API/tests/test_visible_card_instance_masking.py \
            Combat/tests/test_decision_context.py 2>&1 | tee pr64-test.log

      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr64-test-log
          path: pr64-test.log

      - name: Stop on regression failure
        if: steps.regressions.outcome == 'failure'
        run: exit 1

      - name: Remove temporary finalizer machinery
        run: rm .github/pr64_finalize.py .github/workflows/pr64-finalize-exact-instance.yml

      - name: Check and publish verified implementation
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement privacy-safe exact-instance replay pinning'
          git push origin HEAD:replay-prefix-draw-pinning-design
