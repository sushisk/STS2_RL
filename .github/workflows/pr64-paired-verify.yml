name: pr64-paired-verify

on:
  push:
    branches: [replay-prefix-draw-pinning-design]

permissions:
  contents: read

jobs:
  paired:
    if: "${{ github.event.head_commit.message == 'Run temporary PR64 paired Emulator verification' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out RL PR branch
        uses: actions/checkout@v4
        with:
          path: STS2_RL
          ref: replay-prefix-draw-pinning-design

      - name: Check out Emulator PR 25 branch
        uses: actions/checkout@v4
        with:
          repository: sushisk/STS2_Emulator
          path: STS2_Emulator
          ref: replay-prefix-draw-pinning-design

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build paired Emulator
        run: dotnet build STS2_Emulator/Sts2EmulatorPhase1.sln

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python bridge/test dependencies
        run: python -m pip install pythonnet pytest

      - name: Point RL default Emulator path at paired checkout
        working-directory: STS2_RL
        run: ln -s ../STS2_Emulator 'C:\STS2_Emulator'

      - name: Run Acrobatics exact-instance replay regression
        working-directory: STS2_RL
        run: python -m pytest -q API/tests/test_acrobatics_exact_instance_replay_pinning.py
