name: apply-generic-gate-b-v3
on:
  push:
    branches: [replay-prefix-draw-pinning-design]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay-prefix-draw-pinning-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('Combat/search/replay_draw_restore.py')
          s = p.read_text()
          s = one(s, 'from dataclasses import dataclass\nfrom typing import Any, Optional\n', 'from dataclasses import dataclass\nfrom functools import lru_cache\nfrom typing import Any, Optional\n', 'import')
          s = one(s, '    constraints: VisibleDrawConstraints = ()\n    blocks_later_pinning: bool = False\n', '    constraints: VisibleDrawConstraints = ()\n    blocks_later_pinning: bool = False\n    tracking_error: Optional[str] = None\n', 'tracking error')
          a = s.index('def _is_subsequence(')
          b = s.index('def visible_draw_transition_evidence_from_committed_transition(')
          gate_b = r'''def _distinct_draw_sequences_from_options(
    transfer: ObservableTransferEvidence,
    *,
    limit: int = 2,
) -> tuple[tuple[ObservableCardKey, ...], ...]:
    """Return at most ``limit`` distinct R-subsequences of PendingChoice order.

    Gate A proved O = R + E. We remove exactly E occurrences while preserving option
    order. Different occurrence assignments are acceptable only when they collapse to
    the same observable-key sequence; otherwise Gate B is ambiguous and fails closed.
    """
    if limit <= 0:
        return ()
    options = transfer.option_keys
    target_keys = tuple(sorted(transfer.removed_from_draw.keys(), key=repr))
    slots = {key: i for i, key in enumerate(target_keys)}
    initial = tuple(int(transfer.removed_from_draw[key]) for key in target_keys)

    @lru_cache(maxsize=None)
    def visit(index: int, remaining: tuple[int, ...]) -> tuple[tuple[ObservableCardKey, ...], ...]:
        if not any(remaining):
            return ((),)
        if index >= len(options):
            return ()
        results: list[tuple[ObservableCardKey, ...]] = []

        def add(seq: tuple[ObservableCardKey, ...]) -> None:
            if seq not in results and len(results) < limit:
                results.append(seq)

        # Current occurrence belongs to E.
        for tail in visit(index + 1, remaining):
            add(tail)
            if len(results) >= limit:
                return tuple(results)

        # Current occurrence belongs to R.
        key = options[index]
        slot = slots.get(key)
        if slot is not None and remaining[slot] > 0:
            nxt = list(remaining)
            nxt[slot] -= 1
            for tail in visit(index + 1, tuple(nxt)):
                add((key, *tail))
                if len(results) >= limit:
                    break
        return tuple(results)

    return visit(0, initial)


def ordered_draw_sequence(
    pre_state: object,
    post_state: object,
    transfer: ObservableTransferEvidence,
) -> Optional[tuple[ObservableCardKey, ...]]:
    """Generic Gate B: unique option-order subsequence whose multiset is R."""
    del pre_state, post_state
    sequences = _distinct_draw_sequences_from_options(transfer)
    return sequences[0] if len(sequences) == 1 else None


def _stable_root_draw_slice(
    root_snapshot: object,
    cursor: int,
    count: int,
) -> Optional[tuple[ObservableCardKey, ...]]:
    """Independent order sentinel from Held Stable Snapshot, never a fallback source."""
    player = getattr(root_snapshot, 'Player', None)
    draw_pile = getattr(player, 'DrawPile', None)
    if draw_pile is None:
        return None
    cards = list(draw_pile or ())
    if cursor < 0 or count <= 0 or cursor + count > len(cards):
        return None
    return tuple(observable_card_key_from_snapshot(card) for card in cards[cursor:cursor + count])


def _order_validation_projection(key: ObservableCardKey) -> tuple:
    # Snapshot currently lacks enchantment. Compare every mutually-representable field;
    # full materialization still rejects an enchantment representation mismatch.
    return key[:-1]


def _card_ids(sequence: tuple[ObservableCardKey, ...]) -> list[str]:
    return [card_id_from_observable_key(key) for key in sequence]


'''
          s = s[:a] + gate_b + s[b:]
          a = s.index('def visible_draw_transition_evidence_from_committed_transition(')
          b = s.index('def visible_draw_constraints_from_committed_transition(')
          evidence = r'''def visible_draw_transition_evidence_from_committed_transition(
    post_state: object,
    root_snapshot: object,
    replay_prefix: list[object],
    *,
    triggering_action: object,
    pre_battle_state: object,
) -> VisibleDrawTransitionEvidence:
    """Return generic Gate-A+B-proven root-relative draw constraints.

    Gate B derives order from PendingChoice options after removing E. The inferred order
    is independently checked against Held Stable Snapshot at the current draw cursor.
    Snapshot order is never used as a fallback derivation when the two disagree.
    """
    del triggering_action
    if any(bool(getattr(entry, 'visible_draw_tracking_blocked', False)) for entry in replay_prefix):
        return VisibleDrawTransitionEvidence(
            blocks_later_pinning=True,
            tracking_error='draw tracking was already blocked by an earlier Replay Prefix transition',
        )

    transfer = observable_transfer_evidence(pre_battle_state, post_state)
    if transfer is None:
        changed = _draw_multiset_changed(pre_battle_state, post_state)
        return VisibleDrawTransitionEvidence(
            blocks_later_pinning=changed,
            tracking_error='Gate A could not explain an observed DrawPile multiset mutation' if changed else None,
        )

    sequences = _distinct_draw_sequences_from_options(transfer)
    if len(sequences) != 1:
        return VisibleDrawTransitionEvidence(
            blocks_later_pinning=True,
            tracking_error=(
                'Gate B could not uniquely separate draw-origin option occurrences from E; '
                'draw order is ambiguous under observable card equality'
            ),
        )
    sequence = sequences[0]
    cursor = sum(len(getattr(entry, 'visible_draw_constraints', ()) or ()) for entry in replay_prefix)
    expected = _stable_root_draw_slice(root_snapshot, cursor, len(sequence))
    if expected is None:
        return VisibleDrawTransitionEvidence(
            blocks_later_pinning=True,
            tracking_error=(
                f'Gate B could not validate option-derived draw order against Held Stable '
                f'Snapshot offsets {cursor}..{cursor + len(sequence) - 1}'
            ),
        )

    inferred = tuple(_order_validation_projection(key) for key in sequence)
    stable = tuple(_order_validation_projection(key) for key in expected)
    if inferred != stable:
        return VisibleDrawTransitionEvidence(
            blocks_later_pinning=True,
            tracking_error=(
                'Gate B option-order contract rejected: option-derived draw order '
                f'{_card_ids(sequence)!r} disagrees with Held Stable Snapshot order '
                f'{_card_ids(expected)!r} at root offsets {cursor}..{cursor + len(sequence) - 1}'
            ),
        )

    return VisibleDrawTransitionEvidence(
        constraints=tuple((cursor + offset, key) for offset, key in enumerate(sequence))
    )


'''
          s = s[:a] + evidence + s[b:]
          p.write_text(s)

          p = Path('Combat/search/decision_context.py')
          s = p.read_text()
          s = one(s, '    visible_draw_constraints: VisibleDrawConstraints = ()\n    visible_draw_tracking_blocked: bool = False\n', '    visible_draw_constraints: VisibleDrawConstraints = ()\n    visible_draw_tracking_blocked: bool = False\n    visible_draw_tracking_error: "Optional[str]" = None\n', 'entry field')
          s = one(s, '    identity is stored. ``visible_draw_tracking_blocked`` records an intervening\n    DrawPile mutation that could not be explained safely; later transitions must not\n    invent root-relative draw offsets past that point.\n', '    identity is stored. ``visible_draw_tracking_blocked`` records an intervening\n    DrawPile mutation that could not be explained safely; later transitions must not\n    invent root-relative draw offsets past that point. ``visible_draw_tracking_error``\n    retains the fail-closed Gate-A/Gate-B diagnostic so an ordering-contract regression\n    remains observable.\n', 'entry doc')
          p.write_text(s)

          p = Path('Combat/search/main_loop.py')
          s = p.read_text()
          anchor = '            visible_draw_tracking_blocked=(\n                draw_evidence.blocks_later_pinning if draw_evidence is not None else False\n            ),\n'
          s = one(s, anchor, anchor + '            visible_draw_tracking_error=(\n                draw_evidence.tracking_error if draw_evidence is not None else None\n            ),\n', 'main loop')
          p.write_text(s)

          p = Path('API/instance_combat.py')
          s = p.read_text()
          anchor = '                    visible_draw_tracking_blocked=draw_evidence.blocks_later_pinning,\n'
          s = one(s, anchor, anchor + '                    visible_draw_tracking_error=draw_evidence.tracking_error,\n', 'API')
          p.write_text(s)

          p = Path('Combat/tests/test_replay_prefix_visible_draw_pinning.py')
          s = p.read_text()
          s = one(s, 'def _entry(*constraints, blocked: bool = False):\n    return SimpleNamespace(\n        visible_draw_constraints=tuple(constraints),\n        visible_draw_tracking_blocked=blocked,\n    )\n', 'def _entry(*constraints, blocked: bool = False, error: str | None = None):\n    return SimpleNamespace(\n        visible_draw_constraints=tuple(constraints),\n        visible_draw_tracking_blocked=blocked,\n        visible_draw_tracking_error=error,\n    )\n', 'test entry')
          s = one(s, 'def _evidence(pre, post, prefix=()):\n    return visible_draw_transition_evidence_from_committed_transition(\n        post,\n        _root([]),\n        list(prefix),\n        triggering_action=SemanticAction("card", "0:ANY_CARD"),\n        pre_battle_state=pre,\n    )\n', '''def _root_from_public(cards):\n    return _root([\n        _card(f"root-{i}", card["id"], upgraded=bool(card.get("upgraded", False)), cost=int(card.get("cost", 0)))\n        for i, card in enumerate(cards)\n    ])\n\n\ndef _evidence(pre, post, prefix=(), *, root_draw=None):\n    if root_draw is None:\n        root_draw = pre.engine_state["drawPile"]\n    return visible_draw_transition_evidence_from_committed_transition(\n        post,\n        _root_from_public(root_draw),\n        list(prefix),\n        triggering_action=SemanticAction("card", "0:ANY_CARD"),\n        pre_battle_state=pre,\n    )\n''', 'test helper')

          # The direct dispatcher test bypasses _evidence; give it the same independent root oracle.
          pattern = re.compile(
              r'(def test_card_allowlist_and_choice_semantics_are_not_safety_gates\(\).*?'
              r'result = visible_draw_transition_evidence_from_committed_transition\(\n'
              r'\s*post,\n)\s*_root\(\[\]\),',
              re.S,
          )
          s, n = pattern.subn(r'\1        _root_from_public([a]),', s, count=1)
          if n != 1:
              raise SystemExit('failed to patch direct dispatcher test root')

          pattern = re.compile(r'def test_drawn_only_choice_passes_gate_a_and_reuses_same_order_prover_extension_point\(\) -> None:.*?\n\n\ndef test_drawpile_publication_order_is_not_gate_a_evidence', re.S)
          replacement = '''def test_drawn_only_choice_uses_generic_gate_b_without_mechanic_specific_prover() -> None:\n    a, b, c, d = (_public(name) for name in ("A", "B", "C", "D"))\n    h = _public("H")\n    pre = _state(hand=[h], draw=[a, b, c, d])\n    post = _state(hand=[h], draw=[d], options=[a, b, c])\n    transfer = observable_transfer_evidence(pre, post)\n    assert transfer is not None\n    sequence = replay_draw_restore.ordered_draw_sequence(pre, post, transfer)\n    assert sequence is not None\n    assert [card_id_from_observable_key(key) for key in sequence] == ["A", "B", "C"]\n    result = _evidence(pre, post)\n    assert result.blocks_later_pinning is False\n    assert result.tracking_error is None\n    assert [card_id_from_observable_key(key) for _offset, key in result.constraints] == ["A", "B", "C"]\n\n\ndef test_drawpile_publication_order_is_not_gate_a_evidence'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('failed to replace drawn-only test')
          s = one(s, '    first = _evidence(_state(hand=[h], draw=[a, b, c]), post)\n    second = _evidence(_state(hand=[h], draw=[b, a, c]), post)\n', '    root_draw = [a, b, c]\n    first = _evidence(_state(hand=[h], draw=[a, b, c]), post, root_draw=root_draw)\n    second = _evidence(_state(hand=[h], draw=[b, a, c]), post, root_draw=root_draw)\n', 'public-order test')
          anchor = 'def test_unaccounted_drawpile_mutation_blocks_later_root_relative_pinning() -> None:\n'
          extra = '''def test_gate_b_rejects_wrong_option_order_against_stable_root_and_records_error() -> None:\n    a, b, c, d = (_public(name) for name in ("A", "B", "C", "D"))\n    pre = _state(hand=[], draw=[a, b, c, d])\n    post = _state(hand=[], draw=[d], options=[c, b, a])\n    result = _evidence(pre, post, root_draw=[a, b, c, d])\n    assert result.constraints == ()\n    assert result.blocks_later_pinning is True\n    assert result.tracking_error is not None\n    assert 'option-order contract rejected' in result.tracking_error\n    assert "['C', 'B', 'A']" in result.tracking_error\n    assert "['A', 'B', 'C']" in result.tracking_error\n\n\ndef test_gate_b_fails_closed_when_r_and_e_occurrences_make_order_ambiguous() -> None:\n    a, b, c = (_public(name) for name in ("A", "B", "C"))\n    pre = _state(hand=[a], draw=[a, b, c])\n    post = _state(hand=[a], draw=[c], options=[a, b, a])\n    result = _evidence(pre, post, root_draw=[a, b, c])\n    assert result.constraints == ()\n    assert result.blocks_later_pinning is True\n    assert result.tracking_error is not None\n    assert 'ambiguous under observable card equality' in result.tracking_error\n\n\n'''
          s = one(s, anchor, extra + anchor, 'new tests')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m pip install pytest
          python -m compileall -q API Combat/search
          python -m pytest -q Combat/tests/test_replay_prefix_visible_draw_pinning.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-generic-gate-b-v3.yml
          git add Combat/search/replay_draw_restore.py Combat/search/decision_context.py Combat/search/main_loop.py API/instance_combat.py Combat/tests/test_replay_prefix_visible_draw_pinning.py
          git commit -m 'Generalize replay draw order proof'
          git push origin HEAD:replay-prefix-draw-pinning-design
